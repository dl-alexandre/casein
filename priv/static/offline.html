<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <title>DevIDE offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101114;
        color: #f4f4f5;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem
          max(1.25rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 0%, rgb(253 79 0 / 0.16), transparent 24rem),
          #101114;
      }

      main {
        width: min(100%, 28rem);
      }

      img {
        width: 4rem;
        height: 4rem;
        display: block;
        margin-bottom: 1.25rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.5rem, 7vw, 2.25rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #d4d4d8;
        font-size: 0.95rem;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 1.25rem;
        min-height: 2.75rem;
        align-items: center;
        border: 1px solid #3f3f46;
        border-radius: 0.5rem;
        padding: 0 1rem;
        color: #fff;
        text-decoration: none;
        background: #18181b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/pwa-maskable-512.png" alt="" />
      <h1>DevIDE is offline</h1>
      <p>
        Terminal sessions, previews, and agent updates need a live connection. Reconnect to
        continue from the current workspace state.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
