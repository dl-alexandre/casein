# DevIDE host-tmux defaults.
# Container tmux commands intentionally do not use this file: release paths are
# not mounted inside arbitrary workspace containers.

set-option -g mouse on
set-option -s escape-time 0
set-option -g history-limit 50000
set-option -g focus-events on
set-option -g status off
set-option -g pane-border-status off
set-option -g pane-border-lines single
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g renumber-windows on

# Keep the server process alive after the last session is destroyed so a
# transient kill-session storm does not tear down the whole -L server.
# Hard segfaults still wipe sessions; DevIDE reseeds from ScrollbackArchive.
set-option -s exit-empty off

bind-key -T prefix w display-message "DevIDE: use the browser window picker (C-b w)"
bind-key -T prefix s display-message "DevIDE: use the browser session picker (C-b s)"
