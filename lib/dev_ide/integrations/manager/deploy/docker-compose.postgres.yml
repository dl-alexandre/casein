# Dedicated Postgres for DevIDE-on-devbox (stable layout + activation in
# /opt/devide/deploy/README.md and devide.service).
#
# DevIDE itself runs as a systemd unit on the host (see devide.service); only
# its database is containerized. Published on 127.0.0.1:15432 — a port chosen
# to avoid the devbox host's known occupants: 5432 (host Postgres), 5433
# (traintrac-db socat), 25432 (milc-db socat), 6381 (redis socat).
#
#   docker compose -f docker-compose.postgres.yml --env-file /etc/devide/devide.env up -d --wait
#
# The systemd unit runs exactly this as an ExecStartPre step.

name: devide

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEVIDE_PG_USER:-dev_ide}
      POSTGRES_PASSWORD: ${DEVIDE_PG_PASSWORD:?DEVIDE_PG_PASSWORD is required}
      POSTGRES_DB: ${DEVIDE_PG_DB:-dev_ide_prod}
    volumes:
      - devide_pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only — DevIDE connects over 127.0.0.1, nothing else should.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEVIDE_PG_USER:-dev_ide} -d ${DEVIDE_PG_DB:-dev_ide_prod}"]
      interval: 5s
      timeout: 3s
      retries: 20
      # First run initializes the data dir + creates the DB; failures during
      # this window don't count against `retries`.
      start_period: 10s

volumes:
  devide_pgdata:
