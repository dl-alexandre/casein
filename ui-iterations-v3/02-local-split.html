<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0a0a0a;color:#d4d4d4;font-family:'JetBrains Mono',monospace;font-size:13px}
  nav{display:flex;background:#0a0a0a;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#666;border-bottom:1px solid #1a1a1a}
  nav a{color:#666;text-decoration:none;padding:6px 10px;border-right:1px solid #1a1a1a}
  nav a.cur{color:#a8eb12}
  nav a:hover{color:#eee}
  .status{padding:6px 16px;background:#111;border-bottom:1px solid #1a1a1a;display:flex;gap:14px;font-size:11px;color:#888}
  .status b{color:#eee;font-weight:400}
  .status .mode{color:#a8eb12;font-size:10px;letter-spacing:.2em;text-transform:uppercase;border:1px solid #3a5a18;padding:1px 6px;border-radius:2px}
  .status .ok{color:#5eead4}
  .split{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 22px - 28px);gap:1px;background:#1a1a1a}
  .pane{background:#000;display:flex;flex-direction:column;position:relative;overflow:hidden}

  .pane .h b{color:#eee;font-weight:400}
  .term{flex:1;padding:12px 14px;overflow:auto;line-height:1.5}
  .tin{color:#a8eb12} .tout{color:#aaa} .terr{color:#fca5a5}

<div class="status">
  <span class="mode">local</span>
  <span><b>localhost</b></span>
  <span>~/code/myapp · main · 2 attached</span>
  <span class="ok">bearer ✓</span>
  <span style="margin-left:auto" class="clock">--:--:--</span>
</div>
<div class="split">
  <div class="pane" data-deny-host>
    <div class="h"><b>shell</b> · pane 0 · iex</div>
    <div class="term" data-ws="alpha" data-prompt="iex(myapp)> "></div>
  </div>
  <div class="pane" data-deny-host>
    <div class="h"><b>tests</b> · pane 1 · mix test --watch</div>
    <div class="term" data-ws="gamma" data-prompt="$ "></div>
  </div>
</div>
