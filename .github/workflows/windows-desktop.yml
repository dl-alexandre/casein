name: Windows desktop package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - "casein_ghostty_windows/**"
      - "lib/casein/desktop/**"
      - "lib/casein_web/plugs/desktop_auth.ex"
      - "scripts/package-windows-desktop.ps1"
      - "scripts/prepare-windows-preview-runtime.ps1"
      - "scripts/test-windows-desktop-package.ps1"
      - "scripts/report-actions-artifact-quota-failure.sh"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  package-smoke:
    name: Build and smoke-test desktop package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.4"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            assets/package-lock.json
            priv/scripts/package-lock.json

      - name: Restore Mix dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: windows-mix-${{ runner.os }}-1.20.2-29.0.4-${{ hashFiles('mix.lock') }}

      - name: Fetch release dependencies
        shell: pwsh
        run: |
          mix deps.get
          Push-Location assets; npm ci; Pop-Location
          Push-Location priv/scripts; npm ci; Pop-Location
          bash scripts/npm-audit.sh

      - name: Prepare self-contained preview runtime
        shell: pwsh
        run: scripts/prepare-windows-preview-runtime.ps1

      - name: Build deterministic Windows package
        shell: pwsh
        run: scripts/package-windows-desktop.ps1 -OutputPath dist/Casein-windows-x64-ci

      - name: Smoke-test install, upgrade backup, and uninstall
        shell: pwsh
        run: scripts/test-windows-desktop-package.ps1 -PackageRoot dist/Casein-windows-x64-ci

      - name: Upload package and integrity metadata
        id: upload_package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Casein-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/casein-*.json
            dist/casein-*.json.cat
          # Without an explicit cap this step inherits the repo default (90 days).
          # At ~0.40 GB per Casein-windows-x64 package, three 7-day survivors were
          # ~1.2 GB of this repo's live artifacts when quota blew (2026-08-11,
          # #888) while the Windows workstream is PARKED. Keep upload fatal —
          # do not continue-on-error (#889 owns louder quota messaging).
          # 3 days: enough to debug a recent CI package or PR smoke; shorter
          # than macOS's 7 (smaller ~50 MB packages, active release-evidence
          # path). Not 1 day — weekend/PR review lag would lose the only zip.
          # Not blanket-short on other workflows — release evidence stays longer.
          retention-days: 3

      # Hard fail with a structured message when CreateArtifact dies on quota.
      # Do NOT continue-on-error / skip upload — red stays red (#889).
      - name: Diagnose artifact upload failure
        if: failure() && steps.upload_package.conclusion == 'failure'
        env:
          CASEIN_DESKTOP_PLATFORM: Windows
          CASEIN_DESKTOP_WORKFLOW_NAME: Windows desktop package
        shell: bash
        run: bash scripts/report-actions-artifact-quota-failure.sh
