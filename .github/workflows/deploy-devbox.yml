name: Deploy Casein to devbox

on:
  # Auto-deploy on master push is DISABLED while GitHub Actions billing is
  # blocked — every run failed before starting with "recent account payments
  # have failed or your spending limit needs to be increased", so each push
  # only produced a noisy red X.
  #
  # Auto-deploy is now handled ON-BOX, with no GitHub Actions dependency, by a
  # systemd timer that polls origin/master and builds+activates a release when
  # it advances (scripts/deploy-poller.sh + casein-deploy.timer; install with
  # `bash scripts/ensure-casein-deploy-poller.sh`). The test gate runs at push
  # time via .githooks/pre-push. `bash scripts/deploy-local.sh` remains the
  # manual override.
  #
  # This workflow is kept dormant (workflow_dispatch only) as a fallback path
  # for the day Actions billing is restored. To return to GitHub-driven
  # deploys, un-comment the push trigger below and disable the on-box timer
  # (`bash scripts/ensure-casein-deploy-poller.sh --disable`).
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

concurrency:
  group: devbox-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Compile, lint, audit, and test
    runs-on: ubuntu-latest
    # test-cover-gate.sh re-runs the full ~9-min suite across seeds until a
    # clean, complete run (it guards against ExUnit on_exit truncation under
    # load). With compile/audit/lint overhead, 2-3 seed runs blow a 30-min
    # cap and the job is cancelled mid-flight — repeatedly blocking deploys.
    # Give the retrying gate real margin.
    timeout-minutes: 60
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          # Keep in sync with the toolchain in .tool-versions (what the devbox,
          # mise, and the self-hosted PR gate run).
          elixir-version: "1.20.0"
          otp-version: "28.5"

      # The :pty suite must run against the same tmux the devbox runs. Pinned to
      # 3.7 (see scripts/install-tmux.sh and docs/subsystems/tmux_37_cutover.md).
      - name: Restore cached tmux 3.7
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/tmux-3.7
          key: tmux-3.7-${{ runner.os }}
      - name: Install tmux 3.7
        run: |
          export TMUX_PREFIX="$HOME/.local/tmux-3.7"
          export TMUX_INSTALL_SUDO=""
          bash scripts/install-tmux.sh
          echo "$TMUX_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.20.0-28.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.20.0-28.5-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Set up Node for asset lint
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Lint JS hooks
        working-directory: assets
        env:
          NODE_ENV: development
        run: |
          npm ci --include=dev
          npm run lint

      - name: Run precommit checks (compile, audit, sobelow, credo, format, test+coverage)
        run: mix precommit.ci

  deploy:
    name: Build and deploy release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    env:
      RELEASE_TARBALL: casein-release-${{ github.sha }}.tgz
      REMOTE_TARBALL: /tmp/casein-release-${{ github.sha }}.tgz
      REMOTE_DEPLOY_SCRIPT: /tmp/casein-deploy-${{ github.sha }}.sh
      DEVBOX_SSH_HOST: ${{ secrets.DEVBOX_SSH_HOST }}
      DEVBOX_SSH_USER: ${{ secrets.DEVBOX_SSH_USER }}
      DEVBOX_SSH_PORT: ${{ secrets.DEVBOX_SSH_PORT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check latest commit before build
        id: latest_before_build
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ "${latest}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping deploy for superseded commit ${GITHUB_SHA}; latest master is ${latest}."
          fi

      - name: Check deploy secrets
        id: deploy_secrets
        if: steps.latest_before_build.outputs.current == 'true'
        run: |
          set -euo pipefail
          missing=()
          for name in DEVBOX_SSH_HOST DEVBOX_SSH_USER DEVBOX_SSH_PRIVATE_KEY DEVBOX_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'ready=false\n' >> "${GITHUB_OUTPUT}"
            printf '::warning title=Devbox deploy skipped::Missing repository secret(s): %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 0
          fi

          printf 'ready=true\n' >> "${GITHUB_OUTPUT}"
        env:
          DEVBOX_SSH_PRIVATE_KEY: ${{ secrets.DEVBOX_SSH_PRIVATE_KEY }}
          DEVBOX_SSH_KNOWN_HOSTS: ${{ secrets.DEVBOX_SSH_KNOWN_HOSTS }}

      - name: Build release
        if: steps.latest_before_build.outputs.current == 'true'
        run: ./scripts/build-release.sh

      - name: Package release
        if: steps.latest_before_build.outputs.current == 'true'
        run: tar -C release-out -czf "${RELEASE_TARBALL}" .

      - name: Upload release artifact
        if: steps.latest_before_build.outputs.current == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: casein-release-${{ github.sha }}
          path: ${{ env.RELEASE_TARBALL }}
          retention-days: 7

      - name: Report skipped deploy
        if: steps.latest_before_build.outputs.current == 'true' && steps.deploy_secrets.outputs.ready != 'true'
        run: |
          echo "Built and uploaded the release artifact, but skipped devbox deploy because required SSH secrets are not configured."

      - name: Configure SSH
        if: steps.latest_before_build.outputs.current == 'true' && steps.deploy_secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEVBOX_SSH_PRIVATE_KEY}" > ~/.ssh/devbox_deploy_key
          chmod 600 ~/.ssh/devbox_deploy_key
          printf '%s\n' "${DEVBOX_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          DEVBOX_SSH_PRIVATE_KEY: ${{ secrets.DEVBOX_SSH_PRIVATE_KEY }}
          DEVBOX_SSH_KNOWN_HOSTS: ${{ secrets.DEVBOX_SSH_KNOWN_HOSTS }}

      - name: Copy release to devbox
        if: steps.latest_before_build.outputs.current == 'true' && steps.deploy_secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          port="${DEVBOX_SSH_PORT:-22}"
          scp -P "${port}" \
            -i ~/.ssh/devbox_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${RELEASE_TARBALL}" \
            "scripts/deploy-devbox-release.sh" \
            "${DEVBOX_SSH_USER}@${DEVBOX_SSH_HOST}:/tmp/"
          ssh -p "${port}" \
            -i ~/.ssh/devbox_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEVBOX_SSH_USER}@${DEVBOX_SSH_HOST}" \
            "mv /tmp/deploy-devbox-release.sh '${REMOTE_DEPLOY_SCRIPT}' && chmod +x '${REMOTE_DEPLOY_SCRIPT}'"

      - name: Check latest commit before activation
        id: latest_before_activation
        if: steps.latest_before_build.outputs.current == 'true' && steps.deploy_secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ "${latest}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping activation for superseded commit ${GITHUB_SHA}; latest master is ${latest}."
          fi

      - name: Activate release on devbox
        if: steps.latest_before_activation.outputs.current == 'true'
        run: |
          set -euo pipefail
          port="${DEVBOX_SSH_PORT:-22}"
          ssh -p "${port}" \
            -i ~/.ssh/devbox_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEVBOX_SSH_USER}@${DEVBOX_SSH_HOST}" \
            "'${REMOTE_DEPLOY_SCRIPT}' '${REMOTE_TARBALL}' '${GITHUB_SHA}'"
