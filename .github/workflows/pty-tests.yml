name: PTY terminal tests

# The `:pty` suite attaches real tmux PTYs and asserts genuine PTY/owner
# sharing invariants (see test/test_helper.exs). It is reliable only on a
# PTY-stable host and flakes under load in CI sandboxes, so it is excluded
# from the main pipeline. This workflow gives periodic signal anyway:
# failures here mean "investigate on a stable host", not "block the deploy".
# It is advisory by virtue of not being a required check — a failing run is
# left visible (red) rather than masked, so the signal is never lost.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pty:
    name: Run :pty-tagged tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          # Keep in sync with the toolchain in .tool-versions (what the devbox,
          # mise, and the self-hosted PR gate run).
          elixir-version: "1.20.0"
          otp-version: "28.5"

      # Pinned to 3.7 so the :pty suite matches the devbox host (see
      # scripts/install-tmux.sh and docs/subsystems/tmux_37_cutover.md).
      - name: Restore cached tmux 3.7
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/tmux-3.7
          key: tmux-3.7-${{ runner.os }}
      - name: Install tmux 3.7
        run: |
          export TMUX_PREFIX="$HOME/.local/tmux-3.7"
          export TMUX_INSTALL_SUDO=""
          bash scripts/install-tmux.sh
          echo "$TMUX_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.20.0-28.5-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.20.0-28.5-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run PTY and tmux integration suites
        run: |
          mix test test/dev_ide/terminals/session_test.exs --include pty
          mix test test/tmux_ctl/send_keys_bytes_test.exs --include tmux
