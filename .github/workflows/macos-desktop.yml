name: macOS desktop package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "native/casein_menubar/**"
      - "lib/casein/desktop/**"
      - "lib/casein/terminals/tmux_executable.ex"
      - "lib/casein/terminals/tmux_runner.ex"
      - "lib/casein/terminals/host_server_anchor.ex"
      - "lib/casein_web/plugs/desktop_auth.ex"
      - "config/runtime.exs"
      - "mix.exs"
      - "mix.lock"
      - "rel/**"
      - "lib/casein/application.ex"
      - "lib/casein/terminals/shims.ex"
      - "priv/repo/migrations/**"
      - "scripts/package-macos-desktop.sh"
      - "scripts/test-macos-desktop-package.sh"
      - "scripts/with-ephemeral-macos-keychain.sh"
      - ".github/workflows/macos-desktop.yml"
  pull_request:
    paths:
      - "native/casein_menubar/**"
      - "lib/casein/desktop/**"
      - "lib/casein/terminals/tmux_executable.ex"
      - "lib/casein/terminals/tmux_runner.ex"
      - "lib/casein/terminals/host_server_anchor.ex"
      - "lib/casein_web/plugs/desktop_auth.ex"
      - "config/runtime.exs"
      - "mix.exs"
      - "mix.lock"
      - "rel/**"
      - "lib/casein/application.ex"
      - "lib/casein/terminals/shims.ex"
      - "priv/repo/migrations/**"
      - "scripts/package-macos-desktop.sh"
      - "scripts/test-macos-desktop-package.sh"
      - "scripts/with-ephemeral-macos-keychain.sh"
      - ".github/workflows/macos-desktop.yml"

concurrency:
  group: macos-desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-smoke:
    name: Build and verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes run on the self-hosted testserver box, whose
        # minutes are free. GitHub-hosted macOS bills at 10x, and every run of
        # this workflow had failed before starting on the account spending
        # limit — 82 for 82 — so the hosted matrix now runs only on demand,
        # for releases and explicit cross-version verification.
        include: ${{ github.event_name == 'workflow_dispatch' && fromJSON('[{"name":"macOS 14 arm64","runner":"macos-14","cache":"macos-14-arm64"},{"name":"macOS 15 arm64","runner":"macos-15","cache":"macos-15-arm64"},{"name":"macOS 15 Intel","runner":"macos-15-intel","cache":"macos-15-x86_64"},{"name":"macOS 26 arm64","runner":"macos-26","cache":"macos-26-arm64"}]') || fromJSON('[{"name":"macOS 26 arm64 (self-hosted)","runner":["self-hosted","macOS","ARM64","milcmini"],"cache":"selfhosted-macos-26-arm64","selfHosted":true}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # setup-beam publishes no prebuilt OTP for macOS, so the self-hosted box
      # keeps its toolchain in mise instead — the same pin AGENTS.md uses
      # locally and the devbox ships. Shims put mix/elixir/node on PATH for
      # every later step.
      - name: Set up Elixir, Erlang, and Node (self-hosted)
        if: ${{ matrix.selfHosted }}
        run: |
          set -euo pipefail
          MISE="$(command -v mise || echo "$HOME/.local/bin/mise")"
          "$MISE" install
          # Prepended to PATH, so the pinned toolchain wins over whatever
          # Homebrew has installed on the box.
          "$MISE" bin-paths >> "$GITHUB_PATH"

      - name: Set up Elixir and Erlang
        if: ${{ !matrix.selfHosted }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.4"

      - name: Set up Node
        if: ${{ !matrix.selfHosted }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            assets/package-lock.json
            priv/scripts/package-lock.json

      # The self-hosted work folder persists between runs, so deps/ and _build/
      # survive on disk and a cache round-trip would only add upload time.
      - name: Restore Mix build cache
        if: ${{ !matrix.selfHosted }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: macos-mix-${{ matrix.cache }}-1.20.2-29.0.4-${{ hashFiles('mix.lock') }}

      - name: Fetch release dependencies
        run: |
          mix deps.get
          npm --prefix assets ci --no-audit --no-fund
          npm --prefix priv/scripts ci --omit=dev --no-audit --no-fund

      - name: Test host and terminal resolution
        run: |
          mix test test/casein/terminals/tmux_executable_test.exs test/casein/desktop
          # Self-hosted runner sessions have no unlocked login keychain. Keep
          # the real Security.framework round trip without prompting for UI.
          scripts/with-ephemeral-macos-keychain.sh \
            /usr/bin/swift test --package-path native/casein_menubar

      - name: Build self-contained package
        run: scripts/package-macos-desktop.sh

      - name: Verify package structure and signatures
        # This launches the signed app through LaunchServices and must retain
        # the logged-in user's normal GUI keychain context.
        run: scripts/test-macos-desktop-package.sh

      - name: Run packaged lifecycle and crash recovery
        env:
          CASEIN_RELEASE_ROOT: ${{ github.workspace }}/native/casein_menubar/build/Casein MenuBar.app/Contents/Resources/release
        run: |
          scripts/with-ephemeral-macos-keychain.sh \
            /usr/bin/swift test --package-path native/casein_menubar --filter LifecycleIntegration
          scripts/with-ephemeral-macos-keychain.sh \
            /usr/bin/swift test --package-path native/casein_menubar --filter CrashRecovery

      # Retained only off pull_request. `retention-days: 7` capped how long each
      # upload lived but not how many there are: at ~382 MB per commit, every
      # push to every open PR bought another copy, which is what refilled the
      # account artifact quota after the retention fix. A PR still builds and
      # smoke-tests the package — it just does not keep it. Grab a PR's package
      # from a `workflow_dispatch` run on that branch when one is actually
      # needed.
      #
      # Keep this `if` in step with windows-desktop.yml.
      - name: Upload package and integrity metadata
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Casein-${{ matrix.cache }}
          path: native/casein_menubar/build/artifacts/*
          retention-days: 7
