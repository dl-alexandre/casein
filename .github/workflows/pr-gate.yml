name: PR gate

# Runs the same blocking checks as the local pre-push gate
# (scripts/pre-push-check.sh) on every PR into master. The required `gate` job
# runs on a self-hosted runner on the devbox, closing the gap where a PR merged
# on GitHub bypasses the local .githooks/pre-push gate and can land red on
# master. This is intentionally the only gate lane: duplicating the complete
# suite on GitHub-hosted infrastructure consumed the personal Actions budget
# without adding another required status check.
#
# `gate` is the required status check on master (branch protection references the
# workflow name "PR gate" and the job id `gate` — do NOT rename either).

on:
  pull_request:
    branches: [master]
  # Manual re-trigger without an empty commit. Prefer this (or an empty commit)
  # over `gh run rerun` — re-running a stale run cancels the PR's live run because
  # concurrency is per-PR with cancel-in-progress: true (see AGENTS.md).
  workflow_dispatch:

# Per-PR group: a newer push to the SAME PR cancels its superseded run (correct).
# Fall back to github.ref for workflow_dispatch (no pull_request.number) so all
# manual runs do not collapse into one group `pr-gate-` and cancel each other.
# Do NOT use one global group with cancel-in-progress: false — GitHub keeps only
# one pending run per group, so a third PR silently cancels the queued second and
# the required `gate` check never appears (#753 regression / need-ci-shm-53100).
# Host-level single-flight for Mix/_build work is enforced with flock
# (scripts/lib/casein-devbox-mix-lock.sh) shared with preview-e2e. Per-PR
# concurrency still cancels superseded pushes only — do NOT switch to one
# global cancel-in-progress group (#753).
#
# Capacity: only runners labeled `devbox` take this job. Extra runners help
# only if they are separate Linux hosts with the `devbox` label (isolated
# workdirs). milcmini/testserver are macOS and do not match this runs-on.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # SECURITY: never run fork-PR code on the self-hosted runner — it executes
    # arbitrary PR code on the devbox. Only branches pushed to this repo qualify.
    # workflow_dispatch is same-repo only (UI/API on this repo), so it is allowed.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, devbox]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The self-hosted runner is persistent; the default clean:true runs
          # `git clean -ffdx`, which deletes the gitignored _build/, deps/, and
          # assets/node_modules every run and forces a cold compile + full
          # `npm ci`. Keep them to reuse the incremental build cache. Deps drift
          # is still caught: the gate runs `mix deps.get` +
          # `deps.unlock --check-unused`, and `npm ci` re-syncs whenever
          # package-lock.json changes. Escape hatch for a poisoned workdir:
          # delete the runner's work directory to force a clean checkout.
          clean: false

      # `.tool-versions` pins erlang/elixir but not node, and pre-push-check.sh
      # calls `npm` bare from PATH — so the gate silently used whatever node the
      # devbox happened to have (v20). Every other workflow that touches assets
      # (deploy-devbox, macos-desktop, windows-desktop) already pins node 22, so
      # release assets were built on 22 while the gate verified them on 20.
      # jsdom >= 30 makes that divergence fatal: it requires
      # ^22.22.2 || ^24.15.0 || >=26.0.0, and its undici calls
      # `webidl.util.markAsUncloneable`, which does not exist on node 20.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Detect docs-only PR
        id: detect
        shell: bash
        run: |
          # Determine whether the PR touches only documentation. Fetch the base
          # branch explicitly — the pull_request checkout is a merge commit and,
          # with clean:false, the persistent checkout's origin/<base> may be
          # stale. Diff base tree vs HEAD tree (two-dot): a plain tree diff needs
          # no shared history, so it is robust under a shallow checkout.
          # workflow_dispatch has no GITHUB_BASE_REF; fall back to master.
          base_ref="${GITHUB_BASE_REF:-master}"
          git fetch --no-tags origin "$base_ref"
          base_sha="$(git rev-parse FETCH_HEAD)"
          changed="$(git diff --name-only "$base_sha" HEAD)"
          echo "Changed files:"; echo "$changed"
          # Conservative: docs-only means EVERY changed path matches docs/** or
          # *.md. An empty/failed diff or any other path => full gate.
          # docs-only OR skill-only (Casein agent skills under .claude/skills — not
          # part of the mix/npm app surface; full suite is wasted queue time).
          # pr-gate.yml itself is allowed so this detector can land with skill PRs.
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/.*|.*\.md|\.claude/skills/.*|\.github/workflows/pr-gate\.yml)$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          # Skills own executable test suites. The full gate runs them via
          # pre-push-check.sh, but a skill-only PR takes the skip path — which
          # made a skill change the ONE case where nothing ran the skill's own
          # tests: .githooks/pre-push only fires on master pushes, and this gate
          # skipped. Record the signal so the skip path can still test them.
          if echo "$changed" | grep -qE '^\.claude/skills/'; then
            echo "skills_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "skills_touched=false" >> "$GITHUB_OUTPUT"
          fi

      # One locked step: cheap fail-fast (#818) then full pre-push + smoke.
      # Same host flock as preview-e2e (#816) so clean:false _build cannot race.
      # Cheap phase must NOT need zigler/NIF compile — format + shell guards +
      # doc citations first; compile/credo/sobelow stay inside pre-push after.
      - name: Run pre-push gate + release smoke
        if: steps.detect.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The runner service shell is non-login; put mise (which reads
          # .tool-versions) on PATH so `mise exec -- mix ...` resolves.
          export PATH="$HOME/.local/bin:$PATH"
          command -v mise >/dev/null || { echo "mise not found on runner PATH"; exit 1; }
          # shellcheck source=scripts/lib/casein-devbox-mix-lock.sh
          source scripts/lib/casein-devbox-mix-lock.sh
          casein_devbox_mix_lock_acquire
          casein_devbox_heal_zigler_priv .

          # --- Cheap fail-fast (seconds-class; no project compile) ---
          echo ">>> fail-fast cheap: whitespace + bash -n + format + static guards + docs (#818)"
          git diff --check
          bash -n scripts/deploy-devbox-release.sh
          bash -n scripts/deploy-poller.sh
          bash -n scripts/build-release.sh
          bash -n scripts/lib/canary-drain.sh
          bash -n scripts/lib/caddy-upstream.sh
          # deps.get only — needed so format plugins (phoenix_live_view) resolve.
          # Does not compile the app or casein_mob NIFs.
          mise exec -- mix deps.get
          mise exec -- mix format --check-formatted
          ./scripts/check-heex-boolean-attr-guard.sh
          ./scripts/check-portable-defaults-guard.sh
          ./scripts/check-doc-citations.sh

          # Tell precommit.ci / pre-push to skip identical checks already green.
          export CASEIN_GATE_SKIP_FORMAT=1
          export CASEIN_GATE_SKIP_HEEX_BOOL=1
          export CASEIN_GATE_SKIP_PORTABLE=1
          export CASEIN_GATE_SKIP_DOC_CITATIONS=1

          bash scripts/pre-push-check.sh
          # Reuse the production build cache warmed by earlier runs. The smoke
          # keeps its archive/extraction below _build and cleans disposable
          # output; it never publishes or activates the assembled release.
          MIX="mise exec -- mix" bash scripts/release-smoke.sh

      - name: Test changed skills (skill-only PR)
        if: steps.detect.outputs.docs_only == 'true' && steps.detect.outputs.skills_touched == 'true'
        shell: bash
        run: |
          # Cheap and Elixir-free (~2s), so this does not reintroduce the queue
          # cost the skip exists to avoid — but it means a skill-only PR is no
          # longer the one path where a skill's tests never run. Discovered by
          # convention so a new skill is covered the day it lands a suite.
          set -euo pipefail
          found=0
          for suite in .claude/skills/*/references/selftest.mjs; do
            [ -f "$suite" ] || continue
            found=1
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
          if [ "$found" = "0" ]; then
            echo "No skill selftest suites found — nothing to run."
          fi

      - name: Skip gate (docs-only PR)
        if: steps.detect.outputs.docs_only == 'true'
        run: |
          # The job still SUCCEEDS so the required check reports green — we do
          # NOT use a workflow `paths:` filter, which would leave the required
          # check pending forever on docs-only PRs.
          #
          # "Skipped" means the heavy mix/npm suite. Any changed skill's own
          # tests ran in the step above; this step is the docs case and the
          # green-reporting terminator for both.
          echo "Docs/skill-only PR — skipped the heavy gate and reported success."
