# Notify milc-devbox to redeploy when dev_ide master moves.
#
# This is the dispatcher half of the deploy chain. The actual deploy logic
# lives in milc-devbox (.github/workflows/deploy-dev-ide.yml there) — that
# repo owns the EC2_SSH_KEY secret and the devbox CI conventions. dev_ide
# only fires the notification.
#
# Same pattern as the existing milc-dev → milc-devbox sync chain, just a
# different event type: `dev-ide-master-pushed`.
#
# Requires the `MILC_DEVBOX_DISPATCH_PAT` repo secret — a GitHub PAT with
# `repo` scope on MILCGroup/milc-devbox. The existing `SUBMODULE_SYNC_PAT`
# org secret on MILCGroup repos works for the same purpose; add either as
# `MILC_DEVBOX_DISPATCH_PAT` here (this repo is dl-alexandre/, not in the
# MILCGroup org, so the org secret isn't auto-available).

name: Notify milc-devbox to redeploy

on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch
        env:
          PAT: ${{ secrets.MILC_DEVBOX_DISPATCH_PAT }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "::error::MILC_DEVBOX_DISPATCH_PAT secret is not set — see workflow comments"
            exit 1
          fi
          curl -sSf -X POST \
            -H "Authorization: token ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/MILCGroup/milc-devbox/dispatches \
            -d "{\"event_type\":\"dev-ide-master-pushed\",\"client_payload\":{\"sha\":\"${SHA}\"}}"
          echo "::notice::fired dev-ide-master-pushed for ${SHA:0:7}"
