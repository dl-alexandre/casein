# Casein local stack — `docker compose up` to bring up Postgres +
# Casein for a smoke test against the production Dockerfile.
#
#   cp .env.example .env  # fill in SECRET_KEY_BASE + CASEIN_API_TOKEN
#   docker compose build
#   docker compose run --rm dev_ide /app/bin/migrate
#   docker compose up
#
# Then open http://localhost:4000/workspaces.
#
# What this stack does NOT include:
#   - TLS termination (use a reverse proxy or platform fronting for
#     real deployments — see deploy.md CC-2)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casein_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-casein_prod}
    volumes:
      - casein_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casein} -d ${POSTGRES_DB:-casein_prod}"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Not exposed by default — only Casein on the compose network
    # needs to reach it. Uncomment to use psql from the host.
    # ports:
    #   - "5432:5432"

  dev_ide:
    build:
      context: .
      args:
        # The generic Compose stack is the portable product profile. The
        # devbox release builder keeps its separate Dockerfile default.
        DEVIDE_RELEASE_PROFILE: ${DEVIDE_RELEASE_PROFILE:-portable}
    image: ${CASEIN_IMAGE:-casein:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: ${PORT:-4000}
      CASEIN_PROFILE: ${CASEIN_PROFILE:-portable}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required (see .env.example)}
      CASEIN_API_TOKEN: ${CASEIN_API_TOKEN:?CASEIN_API_TOKEN is required (see .env.example)}
      CASEIN_WORKSPACES_ROOT: ${CASEIN_WORKSPACES_ROOT:-/workspaces}
      DATABASE_URL: ecto://${POSTGRES_USER:-casein}:${POSTGRES_PASSWORD:-casein_local_password}@postgres:5432/${POSTGRES_DB:-casein_prod}
    ports:
      - "127.0.0.1:${CASEIN_HOST_PORT:-4000}:${PORT:-4000}"
    volumes:
      # Bind-mount a host directory under which workspaces live.
      # Adjust the host path if your workspaces live elsewhere.
      - "${CASEIN_WORKSPACES_HOST:-./workspaces-local}:${CASEIN_WORKSPACES_ROOT:-/workspaces}"

volumes:
  casein_pgdata:
