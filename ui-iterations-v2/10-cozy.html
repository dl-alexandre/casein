<!doctype html>
<html><head><meta charset="utf-8"><title>10 · cozy</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--cream:#fdf6ec;--ink:#3d2c20;--peach:#f6b89c;--blush:#f4c2c2;--sage:#7a8b69;--mute:#e8dcc8}
  html,body{min-height:100%;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;
    background-image:radial-gradient(circle at 80% 0%,rgba(244,194,194,.4),transparent 50%)}
  nav{display:flex;background:var(--cream);border-bottom:1px solid var(--mute);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#999}
  nav a{color:#999;text-decoration:none;padding:6px 10px;border-right:1px solid var(--mute)}
  nav a.cur{color:var(--ink)}
  nav a:hover{color:var(--ink)}
  .stage{max-width:880px;margin:0 auto;padding:50px 32px}
  header{margin-bottom:24px}
  h1{font-family:'Fraunces',serif;font-size:48px;font-weight:300;letter-spacing:-.02em;line-height:1}
  h1 i{color:var(--peach);font-style:italic}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sage);text-transform:uppercase;letter-spacing:.25em;margin-top:8px}
  .picker{margin:24px 0 14px;display:flex;gap:14px;align-items:center}
  .dropdown{position:relative;background:#fff;border:1px solid var(--mute);border-radius:14px;padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 1px 0 rgba(61,44,32,.04)}
  .dropdown .l{font-size:10px;color:var(--sage);letter-spacing:.2em;text-transform:uppercase}
  .dropdown b{color:var(--ink);font-weight:600}
  .dropdown .arrow{margin-left:8px;color:var(--sage)}
  .ws-switch{display:flex;gap:6px}
  .ws-switch [data-switch]{padding:6px 12px;border:1px solid var(--mute);background:#fff;border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);opacity:.6}
  .ws-switch [data-switch].active{background:var(--peach);border-color:var(--peach);opacity:1}
  .ws-switch [data-switch]:hover{opacity:1}
  .card{background:var(--ink);border-radius:18px;padding:0;box-shadow:0 2px 0 rgba(61,44,32,.04),0 24px 48px rgba(61,44,32,.12);overflow:hidden;position:relative}
  .card .head{padding:9px 16px;background:#2c1f15;display:flex;gap:14px;align-items:center;border-bottom:1px solid #1a1208;font-family:'JetBrains Mono',monospace;font-size:11px;color:#bba288}
  .card .head .dots{display:flex;gap:6px}
  .card .head .dots span{width:11px;height:11px;border-radius:50%;background:#3d2c20}
  .card .head .dots span:nth-child(1){background:#f4c2c2}
  .card .head .dots span:nth-child(2){background:#facc78}
  .card .head .dots span:nth-child(3){background:#a8c896}
  .card .head .ttl{margin-left:8px}
  .card .head .ttl b{color:var(--cream);font-weight:400}
  .card .term{padding:18px 22px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;background:var(--ink);color:var(--cream);min-height:340px;max-height:480px;overflow:auto}
  .card .tin{color:var(--peach)}
  .card .tout{color:#cbb89c}
  .card .terr{color:#f4c2c2}
  .footer{margin-top:18px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sage)}
  .footer .chip{background:#fff;border:1px solid var(--mute);padding:7px 13px;border-radius:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .footer .chip:hover{border-color:var(--blush)}
  .footer .chip b{color:#a85b5b;font-weight:600}
  .footer .clock{font-size:11px}
</style></head>
